name: Rilis

# Membuat rilis setiap kali tag versi didorong, misalnya:
#   git tag v0.1.1
#   git push origin v0.1.1
#
# Seluruh build berjalan di runner GitHub. Tidak ada yang perlu dibangun di komputer
# pengembang. Alurnya: uji dulu, baru bangun, baru terbitkan.
on:
  push:
    tags: ['v*']
  # Tombol "Run workflow" di tab Actions, untuk mencoba tanpa membuat tag.
  # Hasilnya disimpan sebagai artifact, bukan rilis, supaya tidak ada rilis sampah.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  uji:
    name: Uji
    uses: ./.github/workflows/uji.yml

  bangun:
    name: Bangun installer
    runs-on: windows-latest
    needs: [uji]
    steps:
      - uses: actions/checkout@v4

      - name: Siapkan toolchain Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Siapkan Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: app/ui/package-lock.json

      - name: Pasang dependensi frontend
        working-directory: app/ui
        run: npm ci

      - name: Pasang Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Bangun aplikasi, installer, dan versi portabel
        shell: pwsh
        run: |
          $iscc = 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $iscc)) { $iscc = 'C:\Program Files\Inno Setup 6\ISCC.exe' }
          New-Item -ItemType Directory -Force -Path dist-installer | Out-Null
          ./scripts/build-installer.ps1 -SkipAppBuild

      - name: Catat berkas hasil
        shell: pwsh
        run: Get-ChildItem dist-installer -File | Format-Table Name, Length -AutoSize

      - name: Simpan installer dan versi portabel
        uses: actions/upload-artifact@v4
        with:
          name: lofiloop-installer
          path: dist-installer/*
          retention-days: 30

  terbitkan:
    name: Terbitkan rilis
    runs-on: ubuntu-latest
    needs: [bangun]
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4

      - name: Ambil hasil build
        uses: actions/download-artifact@v4
        with:
          name: lofiloop-installer
          path: dist-installer

      - name: Susun catatan rilis
        shell: bash
        run: |
          set -euo pipefail
          versi="${GITHUB_REF_NAME#v}"
          {
            echo "## LofiLoop $versi"
            echo
            echo "Unduh salah satu berkas di bawah."
            echo
            echo "| Berkas | Untuk siapa |"
            echo "|---|---|"
            echo "| \`LofiLoop-Setup-$versi.exe\` | Pemasang. Aplikasi dan FFmpeg dipasang sekaligus. |"
            echo "| \`LofiLoop-$versi-portable.zip\` | Versi portabel. Ekstrak lalu jalankan, tanpa pemasangan. |"
            echo
            echo "Persyaratan: Windows 10 atau 11 (64-bit). Tidak perlu memasang Rust, Node, atau FFmpeg lebih dulu — semuanya sudah dibawa berkas di atas."
            echo
            echo "---"
            echo
            # Ambil bagian versi ini dari CHANGELOG, kalau ada.
            if [ -f CHANGELOG.md ]; then
              awk -v v="$versi" '
                $0 ~ "^## \\[" v "\\]" { mulai = 1; next }
                mulai && /^## \[/ { exit }
                mulai { print }
              ' CHANGELOG.md > catatan.md
            fi
            if [ -s catatan.md ]; then
              cat catatan.md
            else
              echo "Lihat [CHANGELOG.md](CHANGELOG.md) untuk riwayat lengkap."
            fi
          } > release-notes.md
          cat release-notes.md

      - name: Buat rilis
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create "$GITHUB_REF_NAME" \
            --title "LofiLoop ${GITHUB_REF_NAME#v}" \
            --notes-file release-notes.md \
            dist-installer/*
