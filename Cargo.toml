[workspace]
resolver = "2"
members = ["crates/engine", "crates/cli", "app/src-tauri"]

[workspace.package]
version = "0.2.1"
edition = "2021"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = "s"
panic = "abort"
strip = true
