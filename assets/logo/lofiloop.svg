<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="LofiLoop">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2a2f6b"/>
      <stop offset="0.55" stop-color="#4a3a9e"/>
      <stop offset="1" stop-color="#8a4fd0"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8fd4ff"/>
      <stop offset="0.5" stop-color="#b79bff"/>
      <stop offset="1" stop-color="#ff9ad5"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.38" r="0.7">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- alas ikon: persegi membulat -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#bg)"/>
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#glow)"/>

  <!-- cincin loop: dua busur berpanah, membentuk putaran tanpa ujung -->
  <g fill="none" stroke="url(#ring)" stroke-width="40" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 132 262 A 124 124 0 0 1 366 184"/>
    <path d="M 380 250 A 124 124 0 0 1 146 328"/>
  </g>
  <g fill="url(#ring)">
    <path d="M 392 142 L 392 212 L 326 196 Z" transform="rotate(8 392 190)"/>
    <path d="M 120 370 L 120 300 L 186 316 Z" transform="rotate(8 120 322)"/>
  </g>

  <!-- tombol putar di tengah: video yang diulang -->
  <path d="M 226 206 L 226 306 L 312 256 Z" fill="#ffffff" stroke="#ffffff" stroke-width="14" stroke-linejoin="round"/>

  <!-- gelombang audio di bawah: audio yang diulang -->
  <g fill="#ffffff" fill-opacity="0.92">
    <rect x="170" y="392" width="14" height="30" rx="7"/>
    <rect x="200" y="380" width="14" height="54" rx="7"/>
    <rect x="230" y="368" width="14" height="78" rx="7"/>
    <rect x="260" y="378" width="14" height="58" rx="7"/>
    <rect x="290" y="386" width="14" height="42" rx="7"/>
    <rect x="320" y="396" width="14" height="22" rx="7"/>
  </g>
</svg>
